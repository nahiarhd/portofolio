name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest failure first.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # No database and no API key: every test runs on a clean clone.
      - name: Unit tests
        run: pnpm test:unit

      # The build must not need LLM credentials — /api/chat reads them at
      # request time, never at build time. If this step ever starts needing a
      # secret, that is a bug in the route, not a reason to add one here.
      - name: Build
        run: pnpm build

  deadcode:
    name: Dead code report (informational)
    runs-on: ubuntu-latest
    # Advisory only: knip cannot see every dynamic import, so a human reads
    # these before anything is deleted. Never let it block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx knip || true
