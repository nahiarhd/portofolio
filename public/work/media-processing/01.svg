<?xml version="1.0" encoding="UTF-8"?>
<!--
  Media queue, with the two decisions that keep it running.

  Authored from the project's own problem/role copy. The spine is ordinary;
  what is not ordinary is that a corrupt upload leaves the queue instead of
  stalling it, and that the intermediates stay inspectable so a wrong-looking
  summary can be traced back rather than argued about.

  Violet marks the quarantine lane — that is the one that keeps throughput
  tied to queue depth rather than to whichever file broke.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none" role="img">
  <title>Media ingest queue with quarantine and inspectable intermediates</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7f6f2" fill-opacity="0.55"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b883ec"/>
    </marker>
    <style>
      .l { font-family: ui-monospace, "Space Mono", "SFMono-Regular", Menlo, monospace; }
      .stage { font-size: 34px; letter-spacing: 2px; fill: #f7f6f2; }
      .eyebrow { font-size: 32px; letter-spacing: 7px; fill: #928c83; }
      .note { font-size: 32px; letter-spacing: 3px; fill: #b883ec; }
      .caption { font-size: 32px; letter-spacing: 4px; fill: #928c83; }
      .stack { font-size: 30px; letter-spacing: 1px; fill: #928c83; }
      .box { stroke: #f7f6f2; stroke-opacity: 0.28; stroke-width: 1.5; }
      .wire { stroke: #f7f6f2; stroke-opacity: 0.55; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="l eyebrow" x="70" y="72">MEDIA QUEUE</text>
  <line x1="70" y1="98" x2="1130" y2="98" stroke="#f7f6f2" stroke-opacity="0.14"/>

  <rect class="box" x="70"  y="200" width="200" height="120"/>
  <rect class="box" x="363" y="200" width="160" height="120"/>
  <rect class="box" x="616" y="200" width="230" height="120"/>
  <rect class="box" x="939" y="200" width="190" height="120"/>

  <text class="l stage" x="170" y="263" text-anchor="middle" dominant-baseline="middle">QUEUE</text>
  <text class="l stage" x="443" y="263" text-anchor="middle" dominant-baseline="middle">STT</text>
  <text class="l stage" x="731" y="263" text-anchor="middle" dominant-baseline="middle">SUMMARY</text>
  <text class="l stage" x="1034" y="263" text-anchor="middle" dominant-baseline="middle">BRIEF</text>

  <line class="wire" x1="270" y1="260" x2="356" y2="260" marker-end="url(#a)"/>
  <line class="wire" x1="523" y1="260" x2="609" y2="260" marker-end="url(#a)"/>
  <line class="wire" x1="846" y1="260" x2="932" y2="260" marker-end="url(#a)"/>

  <!-- Intermediates are retained, not discarded between stages. -->
  <path d="M443 320 V370 H731 V320" stroke="#f7f6f2" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text class="l caption" x="587" y="415" text-anchor="middle">KEPT INSPECTABLE</text>

  <!-- A bad file leaves the queue rather than blocking it. -->
  <path d="M170 320 V430 H215 V476" stroke="#b883ec" stroke-width="1.5" stroke-dasharray="8 8" marker-end="url(#av)"/>
  <rect x="90" y="480" width="250" height="110" stroke="#b883ec" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="8 8"/>
  <text class="l stage" x="215" y="535" text-anchor="middle" dominant-baseline="middle">ISOLATED</text>
  <text class="l note" x="400" y="640" text-anchor="middle">CANNOT STALL THE QUEUE</text>

  <line x1="70" y1="676" x2="1130" y2="676" stroke="#f7f6f2" stroke-opacity="0.14"/>
  <text class="l stack" x="70" y="716">PYTHON · SPEECH-TO-TEXT · LLM SUMMARIZATION</text>
</svg>
