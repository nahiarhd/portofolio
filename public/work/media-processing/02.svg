<?xml version="1.0" encoding="UTF-8"?>
<!--
  From wall-of-text transcript to skimmable brief.

  Companion to 01 (the queue). Authored from problem/role: speech-to-text alone
  dumped walls of text with no chapters and weak speaker structure — nothing a
  decision-maker could skim. The second frame is the structuring path that
  turns a raw transcript into a brief under time pressure, then hands off into
  operator services.

  Violet marks structure. That is what STT alone never provides.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none" role="img">
  <title>Transcript structuring into chapters, speakers, and a skimmable brief</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7f6f2" fill-opacity="0.55"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b883ec"/>
    </marker>
    <style>
      .l { font-family: ui-monospace, "Space Mono", "SFMono-Regular", Menlo, monospace; }
      .stage { font-size: 34px; letter-spacing: 2px; fill: #f7f6f2; }
      .eyebrow { font-size: 32px; letter-spacing: 7px; fill: #928c83; }
      .note { font-size: 32px; letter-spacing: 3px; fill: #b883ec; }
      .caption { font-size: 32px; letter-spacing: 4px; fill: #928c83; }
      .stack { font-size: 30px; letter-spacing: 1px; fill: #928c83; }
      .box { stroke: #f7f6f2; stroke-opacity: 0.28; stroke-width: 1.5; }
      .wire { stroke: #f7f6f2; stroke-opacity: 0.55; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="l eyebrow" x="70" y="72">STRUCTURE PATH</text>
  <line x1="70" y1="98" x2="1130" y2="98" stroke="#f7f6f2" stroke-opacity="0.14"/>

  <rect class="box" x="70"  y="230" width="220" height="130"/>
  <rect class="box" x="370" y="230" width="200" height="130"/>
  <rect class="box" x="650" y="230" width="200" height="130"/>
  <rect class="box" x="930" y="230" width="190" height="130"/>

  <text class="l stage" x="180"  y="298" text-anchor="middle" dominant-baseline="middle">WALL TEXT</text>
  <text class="l stage" x="470"  y="298" text-anchor="middle" dominant-baseline="middle">CHAPTERS</text>
  <text class="l stage" x="750"  y="298" text-anchor="middle" dominant-baseline="middle">SPEAKERS</text>
  <text class="l stage" x="1025" y="298" text-anchor="middle" dominant-baseline="middle">BRIEF</text>

  <line class="wire" x1="290" y1="295" x2="363" y2="295" marker-end="url(#a)"/>
  <!-- Structure is the product; mark the first recovery step. -->
  <line x1="570" y1="295" x2="643" y2="295" stroke="#b883ec" stroke-width="1.5" marker-end="url(#av)"/>
  <line class="wire" x1="850" y1="295" x2="923" y2="295" marker-end="url(#a)"/>
  <text class="l note" x="470" y="205" text-anchor="middle">STRUCTURE</text>

  <rect class="box" x="820" y="460" width="300" height="110"/>
  <text class="l stage" x="970" y="518" text-anchor="middle" dominant-baseline="middle">OPERATOR</text>
  <path d="M1025 360 V453" class="wire" marker-end="url(#a)"/>
  <text class="l caption" x="600" y="600" text-anchor="middle">SKIMMABLE · NOT A FULL LISTEN</text>

  <line x1="70" y1="676" x2="1130" y2="676" stroke="#f7f6f2" stroke-opacity="0.14"/>
  <text class="l stack" x="70" y="716">PYTHON · SPEECH-TO-TEXT · LLM SUMMARIZATION</text>
</svg>
