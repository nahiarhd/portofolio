<?xml version="1.0" encoding="UTF-8"?>
<!--
  Both sides of the integration.

  Companion to 01 (reporting fan-in). Authored from role/outcome: built the
  interface and connected it to backend services, covering both sides — first
  project taking a product from views to working integration. Manual reporting
  was inconsistent between people preparing it; one surface removes that.

  Violet marks BOTH SIDES. A dashboard without the wire is only a mock.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none" role="img">
  <title>Interface and backend owned together through a REST integration</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7f6f2" fill-opacity="0.55"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b883ec"/>
    </marker>
    <style>
      .l { font-family: ui-monospace, "Space Mono", "SFMono-Regular", Menlo, monospace; }
      .stage { font-size: 34px; letter-spacing: 2px; fill: #f7f6f2; }
      .eyebrow { font-size: 32px; letter-spacing: 7px; fill: #928c83; }
      .note { font-size: 32px; letter-spacing: 3px; fill: #b883ec; }
      .caption { font-size: 32px; letter-spacing: 4px; fill: #928c83; }
      .stack { font-size: 30px; letter-spacing: 1px; fill: #928c83; }
      .box { stroke: #f7f6f2; stroke-opacity: 0.28; stroke-width: 1.5; }
      .wire { stroke: #f7f6f2; stroke-opacity: 0.55; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="l eyebrow" x="70" y="72">END TO END</text>
  <line x1="70" y1="98" x2="1130" y2="98" stroke="#f7f6f2" stroke-opacity="0.14"/>

  <rect class="box" x="100" y="200" width="280" height="140"/>
  <rect class="box" x="100" y="420" width="280" height="140"/>

  <text class="l stage" x="240" y="273" text-anchor="middle" dominant-baseline="middle">INTERFACE</text>
  <text class="l stage" x="240" y="493" text-anchor="middle" dominant-baseline="middle">SERVICES</text>

  <line class="wire" x1="380" y1="270" x2="520" y2="370"/>
  <line class="wire" x1="380" y1="490" x2="520" y2="390"/>

  <rect x="530" y="310" width="220" height="130" stroke="#b883ec" stroke-opacity="0.7" stroke-width="2"/>
  <text class="l stage" x="640" y="378" text-anchor="middle" dominant-baseline="middle">REST</text>
  <text class="l note" x="640" y="275" text-anchor="middle">BOTH SIDES</text>

  <line class="wire" x1="750" y1="375" x2="830" y2="375" marker-end="url(#av)"/>

  <rect class="box" x="840" y="310" width="260" height="130"/>
  <text class="l stage" x="970" y="378" text-anchor="middle" dominant-baseline="middle">DASHBOARD</text>

  <text class="l caption" x="600" y="560" text-anchor="middle">VIEWS TO WORKING INTEGRATION</text>
  <text class="l caption" x="600" y="610" text-anchor="middle">ONE SURFACE · CONSISTENT REPORTS</text>

  <line x1="70" y1="676" x2="1130" y2="676" stroke="#f7f6f2" stroke-opacity="0.14"/>
  <text class="l stack" x="70" y="716">BOOTSTRAP · JAVASCRIPT · REST INTEGRATION</text>
</svg>
