<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reporting fan-in.

  The simplest frame in the set, on purpose. This was an internship project and
  the case study says so; inventing architecture it did not have would be worse
  than drawing what it was. Several platforms were collated by hand, slowly and
  inconsistently between whoever prepared them, and the work replaced that with
  one integration and one view.

  Violet marks the convergence, because consolidation is the whole claim — not
  the dashboard, which is only where the result is read.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none" role="img">
  <title>Several reporting sources converging into one dashboard</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7f6f2" fill-opacity="0.55"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b883ec"/>
    </marker>
    <style>
      .l { font-family: ui-monospace, "Space Mono", "SFMono-Regular", Menlo, monospace; }
      .stage { font-size: 34px; letter-spacing: 2px; fill: #f7f6f2; }
      .eyebrow { font-size: 32px; letter-spacing: 7px; fill: #928c83; }
      .note { font-size: 32px; letter-spacing: 3px; fill: #b883ec; }
      .stack { font-size: 30px; letter-spacing: 1px; fill: #928c83; }
      .box { stroke: #f7f6f2; stroke-opacity: 0.28; stroke-width: 1.5; }
      .wire { stroke: #f7f6f2; stroke-opacity: 0.55; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="l eyebrow" x="70" y="72">REPORTING FAN-IN</text>
  <line x1="70" y1="98" x2="1130" y2="98" stroke="#f7f6f2" stroke-opacity="0.14"/>

  <rect class="box" x="70" y="170" width="260" height="110"/>
  <rect class="box" x="70" y="305" width="260" height="110"/>
  <rect class="box" x="70" y="440" width="260" height="110"/>

  <text class="l stage" x="200" y="225" text-anchor="middle" dominant-baseline="middle">SOURCE 01</text>
  <text class="l stage" x="200" y="360" text-anchor="middle" dominant-baseline="middle">SOURCE 02</text>
  <text class="l stage" x="200" y="495" text-anchor="middle" dominant-baseline="middle">SOURCE 03</text>

  <!-- Collection spine: three hand-collated reports become one path. -->
  <line class="wire" x1="330" y1="225" x2="470" y2="225"/>
  <line class="wire" x1="330" y1="360" x2="470" y2="360"/>
  <line class="wire" x1="330" y1="495" x2="470" y2="495"/>
  <line x1="470" y1="225" x2="470" y2="495" stroke="#b883ec" stroke-width="2.5"/>
  <line x1="470" y1="360" x2="513" y2="360" stroke="#b883ec" stroke-width="2.5" marker-end="url(#av)"/>

  <rect class="box" x="520" y="305" width="310" height="110"/>
  <text class="l stage" x="675" y="360" text-anchor="middle" dominant-baseline="middle">INTEGRATION</text>

  <line class="wire" x1="830" y1="360" x2="863" y2="360" marker-end="url(#a)"/>

  <rect class="box" x="870" y="305" width="260" height="110"/>
  <text class="l stage" x="1000" y="360" text-anchor="middle" dominant-baseline="middle">DASHBOARD</text>

  <text class="l note" x="675" y="620" text-anchor="middle">REPLACES MANUAL COLLATION</text>

  <line x1="70" y1="676" x2="1130" y2="676" stroke="#f7f6f2" stroke-opacity="0.14"/>
  <text class="l stack" x="70" y="716">BOOTSTRAP · JAVASCRIPT · REST INTEGRATION</text>
</svg>
